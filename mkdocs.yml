site_name: Homelab k3s GitOps Docs
site_description: Architectural documentation, deployment guides, and manifests for the k3s cluster
site_author: Baptiste
repo_url: https://github.com/ZiplEix/homelab-infra
repo_name: ZiplEix/homelab-infra

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture:
      - Networking & Ingress: architecture/networking.md
      - DNS & TLS Automation: architecture/dns-tls.md
      - GitOps & Delivery: architecture/gitops.md
  - Operational Guides:
      - Secret Encryption Runbook: guides/secrets.md
      - Service Onboarding Guide: guides/new-service.md
      - Stateful Workloads & Backups: guides/database.md
  - Manifest Reference:
      - Standard Application Manifest: templates/standard-app.md
      - StatefulSet Manifest: templates/database-app.md
