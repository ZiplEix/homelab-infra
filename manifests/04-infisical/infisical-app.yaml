apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/'
    chart: infisical-standalone
    targetRevision: 1.10.0
    helm:
      valuesObject:
        ingress-nginx:
          enabled: false
        nginx-ingress:
          enabled: false

        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: vault.baptiste.zip
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: vault-baptiste-zip-tls
              hosts:
                - vault.baptiste.zip

        infisical:
          existingSecret: infisical-secrets
          siteUrl: "https://vault.baptiste.zip"

        postgresql:
          enabled: true
          primary:
            persistence:
              enabled: true
              storageClass: local-path
              size: 5Gi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: infisical
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
