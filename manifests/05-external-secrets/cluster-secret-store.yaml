apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      auth:
        universalAuthCredentials:
          clientId:
            secretRef:
              name: infisical-auth-secret
              namespace: external-secrets
              key: clientId
          clientSecret:
            secretRef:
              name: infisical-auth-secret
              namespace: external-secrets
              key: clientSecret
      hostAPI: "https://vault.baptiste.zip"
      projectSlug: "homelab"
      environment: "prod"
